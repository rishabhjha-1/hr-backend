services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrportal
      POSTGRES_PASSWORD: hrportal
      POSTGRES_DB: hrportal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrportal -d hrportal']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://hrportal:hrportal@postgres:5432/hrportal?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
